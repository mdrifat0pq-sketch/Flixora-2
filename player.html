<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flixora Player</title>
    <style>
        body { background: #000; margin: 0; display: flex; flex-direction: column; height: 100vh; justify-content: center; overflow: hidden; }
        #video-container { position: relative; width: 100%; height: 56.25vw; /* 16:9 Ratio */ }
        iframe { width: 100%; height: 100%; border: none; }
        
        /* বাংলা সাবটাইটেল লেয়ার */
        #bn-subtitle-overlay {
            position: absolute;
            bottom: 10%;
            width: 100%;
            text-align: center;
            pointer-events: none; /* যাতে ভিডিও কন্ট্রোলে সমস্যা না হয় */
        }
        #subtitle-text {
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 4px 12px;
            font-size: 18px;
            border-radius: 5px;
            display: inline-block;
            font-family: 'Hind Siliguri', sans-serif; /* বাংলা ফন্ট */
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@500&display=swap" rel="stylesheet">
</head>
<body>

    <div id="video-container">
        <iframe id="wetv-iframe" src="" allowfullscreen></iframe>
        
        <div id="bn-subtitle-overlay">
            <span id="subtitle-text">বাংলা সাবটাইটেল লোড হচ্ছে...</span>
        </div>
    </div>

    <script>
        // ইউআরএল থেকে ভিডিওর লিঙ্ক নেওয়া
        const urlParams = new URLSearchParams(window.location.search);
        const videoUrl = urlParams.get('video');
        const iframe = document.getElementById('wetv-iframe');
        iframe.src = videoUrl;

        // --- সাবটাইটেল ট্রান্সলেশন লজিক ---
        // নোট: সরাসরি আইফ্রেম থেকে ডাটা নেওয়া সিকিউরিটি কারণে কঠিন, 
        // তাই আমরা ইংরেজি সাবটাইটেল ফাইলটি অনুবাদ করার ফাংশন ব্যবহার করব।
        
        async function translateSubtitle(englishText) {
            // এটি গুগল ট্রান্সলেট ব্যবহার করে টেক্সটকে বাংলায় রূপান্তর করবে
            const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=bn&dt=t&q=${encodeURI(englishText)}`);
            const data = await res.json();
            return data[0][0][0];
        }

        // উদাহরণ হিসেবে সাবটাইটেল আপডেট (এটি পরে ডাইনামিক করা হবে)
        async function updateSubtitle(text) {
            const translated = await translateSubtitle(text);
            document.getElementById('subtitle-text').innerText = translated;
        }

        // টেস্ট করার জন্য
        updateSubtitle("Welcome to Flixora. Enjoy your drama!");
    </script>
</body>
  </html>
